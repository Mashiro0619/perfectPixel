[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perfect-pixel"
dynamic = ["version"]
description = "A library for auto grid detection and pixel art refinement."
readme = "readme.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "theAmusing", email = "amusingyyy@gmail.com" }
]
keywords = ["pixel", "pixel-art", "pixel-style", "computer-vision", "opencv", "numpy", "image-processing"]

dependencies = [
    "numpy>=1.20.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
# pip install "perfect-pixel[opencv]"
opencv = ["opencv-python"]
debug = ["matplotlib>=3.3"]
test = [
    "pytest>=7.0",
    "Pillow>=8.0",
    "build>=0.10",
    "setuptools>=61.0",
    "wheel",
    "tomli>=1.1; python_version < '3.11'",
]

[project.urls]
"Homepage" = "https://github.com/theamusing/perfectPixel"
"Web Demo" = "https://github.com/theamusing/perfectPixel_webdemo"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["perfect_pixel*"]

[tool.setuptools.dynamic]
version = {attr = "perfect_pixel.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
